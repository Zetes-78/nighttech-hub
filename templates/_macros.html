{% macro csrf() %}<input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% endmacro %}
{% macro badge(s) %}<span class="badge st-{{ s|slug }}">{{ s }}</span>{% endmacro %}
{% macro options(items, selected='') %}{% for i in items %}<option value="{{ i }}" {{ 'selected' if i == selected }}>{{ i if i else '(none)' }}</option>{% endfor %}{% endmacro %}
